trigger:
- main

resources:
- repo: self


variables:
- group: GitHub-Secrets

- name: dockerRegistryServiceConnection
  value: '4ca1b796-fefa-4a30-bdb2-151c27da6be6'

- name: imageRepository
  value: 'app1nginxaks'

- name: containerRegistry
  value: 'akscontaineregistrydemo.azurecr.io'

- name: dockerfilePath
  value: '**/Dockerfile'

- name: tag
  value: '$(Build.SourceVersion)'

- name: vmImageName
  value: 'ubuntu-latest'

- script: |
    sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
      -O /usr/local/bin/yq
    sudo chmod +x /usr/local/bin/yq
    yq --version
  displayName: Install yq

stages:

- stage: Build

  displayName: Build and Push

  jobs:

  - job: Build

    displayName: Build Docker Image

    pool:

      vmImage: $(vmImageName)


    steps:


    # Checkout Application Repository
    - checkout: self
      persistCredentials: true


    # Build and Push Image to ACR

    - task: Docker@2

      displayName: Build and Push Image

      inputs:

        command: buildAndPush

        repository: $(imageRepository)

        dockerfile: $(dockerfilePath)

        containerRegistry: $(dockerRegistryServiceConnection)

        tags: |
          $(tag)



    - script: |
        set -e

        rm -rf gitops-repo

        git clone https://$(GITHUB_PAT)@github.com/nishadZC/gitops-repo.git

        cd gitops-repo/app1

        yq -i '
        .spec.template.spec.containers[0].image =
        "$(containerRegistry)/$(imageRepository):$(Build.SourceVersion)"
        ' deployment.yml

        echo "Updated image:"
        yq '.spec.template.spec.containers[0].image' deployment.yml

        git config user.email "azurepipeline@gmail.com"
        git config user.name "Azure Pipeline"

        git add deployment.yml

        git diff --cached --quiet || \
        git commit -m "Deploy $(Build.SourceVersion)"

        git push origin main
      displayName: Update GitOps Repository