trigger:
- main

resources:
- repo: self


variables:

  dockerRegistryServiceConnection: '4ca1b796-fefa-4a30-bdb2-151c27da6be6'

  imageRepository: 'app1nginxaks'

  containerRegistry: 'akscontaineregistrydemo.azurecr.io'

  dockerfilePath: '**/Dockerfile'

  tag: '$(Build.BuildId)'

  vmImageName: 'ubuntu-latest'


stages:

- stage: Build

  displayName: Build and Push

  jobs:

  - job: Build

    displayName: Build Docker Image

    pool:

      vmImage: $(vmImageName)


    steps:


    # Checkout Application Repository
    - checkout: self
      persistCredentials: true


    # Build and Push Image to ACR

    - task: Docker@2

      displayName: Build and Push Image

      inputs:

        command: buildAndPush

        repository: $(imageRepository)

        dockerfile: $(dockerfilePath)

        containerRegistry: $(dockerRegistryServiceConnection)

        tags: |
          $(tag)



    - script: |

        git clone https://$(GITHUB_PAT)@github.com/nishadZC/gitops-repo.git

        cd gitops-repo/app1

        sed -i "s|image:.*|image: $(containerRegistry)/$(imageRepository):$(Build.BuildId)|" deployment.yml


        git config user.email "azurepipeline@gmail.com"
        git config user.name "Azure Pipeline"

        git add deployment.yml


        git commit -m "Update image $(Build.BuildId)"

        git push origin main

      displayName: Update GitOps Repository